<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">HumanoidTH Submission Review Workflow</title>
  <desc id="desc">Official process diagram showing contributor submission, system queueing, administrator review, and the outcomes: needs review, rejected, or approved and published.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#527461"/></marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#91A899"/></marker>
  </defs>
  <rect width="1600" height="1100" fill="#F5F7F5"/>
  <rect x="52" y="40" width="1496" height="1020" rx="24" fill="#FFFFFF" stroke="#D9E2DC" stroke-width="2"/>

  <text x="96" y="101" class="mono" font-size="15" font-weight="700" letter-spacing="2.4" fill="#527461">HUMANOIDTH  /  OPERATIONS</text>
  <text x="96" y="158" class="sans" font-size="38" font-weight="750" fill="#183326">Submission &amp; Review Workflow</text>
  <text x="96" y="193" class="sans" font-size="18" fill="#64746A">Community evidence intake, administrator decision, and publication to the atlas</text>
  <line x1="96" y1="221" x2="1504" y2="221" stroke="#E3E9E5" stroke-width="2"/>

  <text x="96" y="262" class="mono" font-size="13" font-weight="700" letter-spacing="1.5" fill="#668073">01  INTAKE AND REVIEW</text>

  <!-- Stage 1 -->
  <rect x="96" y="285" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#C9D7CE" stroke-width="2"/>
  <path d="M112 285h368a16 16 0 0 1 16 16v50H96v-50a16 16 0 0 1 16-16Z" fill="#EAF2EC"/>
  <circle cx="132" cy="321" r="18" fill="#245C3D"/><text x="132" y="328" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="162" y="328" class="sans" font-size="20" font-weight="700" fill="#183326">Contributor submits</text>
  <text x="124" y="382" class="sans" font-size="16" fill="#37483E">Sign in with an email account, then provide:</text>
  <circle cx="132" cy="414" r="4" fill="#527461"/><text x="148" y="420" class="sans" font-size="16" fill="#37483E">Record type and title</text>
  <circle cx="132" cy="447" r="4" fill="#527461"/><text x="148" y="453" class="sans" font-size="16" fill="#37483E">Public source URL (required)</text>
  <circle cx="132" cy="480" r="4" fill="#527461"/><text x="148" y="486" class="sans" font-size="16" fill="#37483E">Supporting notes, when relevant</text>
  <rect x="124" y="503" width="174" height="22" rx="11" fill="#F1F5F2"/><text x="211" y="519" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#527461">USER ACTION</text>

  <!-- Connector 1 -->
  <line x1="510" y1="410" x2="562" y2="410" stroke="#527461" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="578" y="285" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#C9D7CE" stroke-width="2"/>
  <path d="M594 285h368a16 16 0 0 1 16 16v50H578v-50a16 16 0 0 1 16-16Z" fill="#EAF2EC"/>
  <circle cx="614" cy="321" r="18" fill="#245C3D"/><text x="614" y="328" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="644" y="328" class="sans" font-size="20" font-weight="700" fill="#183326">System records submission</text>
  <text x="606" y="382" class="sans" font-size="16" fill="#37483E">The submission is saved and linked to</text>
  <text x="606" y="406" class="sans" font-size="16" fill="#37483E">the contributor’s account.</text>
  <rect x="606" y="430" width="155" height="34" rx="8" fill="#F1F5F2" stroke="#DCE6DF"/>
  <text x="683" y="452" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#365B45">QUEUED</text>
  <text x="606" y="492" class="sans" font-size="15" fill="#64746A">Visible in the admin review queue and</text>
  <text x="606" y="514" class="sans" font-size="15" fill="#64746A">the contributor’s Profile.</text>

  <!-- Connector 2 -->
  <line x1="992" y1="410" x2="1044" y2="410" stroke="#527461" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="1060" y="285" width="444" height="250" rx="16" fill="#FFFFFF" stroke="#C9D7CE" stroke-width="2"/>
  <path d="M1076 285h412a16 16 0 0 1 16 16v50h-444v-50a16 16 0 0 1 16-16Z" fill="#EAF2EC"/>
  <circle cx="1096" cy="321" r="18" fill="#245C3D"/><text x="1096" y="328" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1126" y="328" class="sans" font-size="20" font-weight="700" fill="#183326">Administrator review</text>
  <text x="1088" y="382" class="sans" font-size="16" fill="#37483E">Verify the source and submission details.</text>
  <text x="1088" y="414" class="sans" font-size="16" fill="#37483E">Record a decision and reviewer note:</text>
  <rect x="1088" y="440" width="126" height="34" rx="8" fill="#FFF5DF" stroke="#EAD49B"/>
  <text x="1151" y="462" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#89681A">NEEDS_REVIEW</text>
  <rect x="1224" y="440" width="113" height="34" rx="8" fill="#FCECEA" stroke="#E9C2BD"/>
  <text x="1280" y="462" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#9C4B40">REJECTED</text>
  <rect x="1347" y="440" width="129" height="34" rx="8" fill="#E8F3EB" stroke="#C5DCCB"/>
  <text x="1411" y="462" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#2D7045">APPROVED</text>
  <text x="1088" y="505" class="sans" font-size="14" fill="#64746A">Notes and current status appear in Profile.</text>

  <!-- Branch connector -->
  <path d="M1282 535v40M294 575h1118M294 575v26M800 575v26M1322 575v26" fill="none" stroke="#91A899" stroke-width="2.5"/>
  <circle cx="1282" cy="575" r="5" fill="#527461"/>

  <text x="96" y="612" class="mono" font-size="13" font-weight="700" letter-spacing="1.5" fill="#668073">02  REVIEW OUTCOMES</text>

  <!-- Needs review outcome -->
  <rect x="96" y="638" width="396" height="208" rx="14" fill="#FFFCF5" stroke="#E8D8AD" stroke-width="2"/>
  <rect x="96" y="638" width="396" height="8" rx="4" fill="#C69735"/>
  <text x="124" y="685" class="sans" font-size="19" font-weight="700" fill="#725719">Needs review</text>
  <text x="124" y="718" class="sans" font-size="15" fill="#48564D">Status remains in the review queue.</text>
  <text x="124" y="743" class="sans" font-size="15" fill="#48564D">Reviewer notes are visible in Profile.</text>
  <text x="124" y="790" class="mono" font-size="12" font-weight="700" fill="#89681A">STATUS  /  NEEDS_REVIEW</text>
  <text x="124" y="819" class="sans" font-size="13" fill="#7B7F74">Further catalog work is handled by an administrator.</text>

  <!-- Rejected outcome -->
  <rect x="602" y="638" width="396" height="208" rx="14" fill="#FFF9F8" stroke="#E8C8C3" stroke-width="2"/>
  <rect x="602" y="638" width="396" height="8" rx="4" fill="#B95E52"/>
  <text x="630" y="685" class="sans" font-size="19" font-weight="700" fill="#8E4037">Rejected</text>
  <text x="630" y="718" class="sans" font-size="15" fill="#48564D">The record is not published to the atlas.</text>
  <text x="630" y="743" class="sans" font-size="15" fill="#48564D">The decision and notes remain in Profile.</text>
  <text x="630" y="790" class="mono" font-size="12" font-weight="700" fill="#9C4B40">STATUS  /  REJECTED</text>
  <text x="630" y="819" class="sans" font-size="13" fill="#7B7F74">No public atlas record is created.</text>

  <!-- Approved outcome -->
  <rect x="1108" y="638" width="396" height="208" rx="14" fill="#F8FCF9" stroke="#C7DCCB" stroke-width="2"/>
  <rect x="1108" y="638" width="396" height="8" rx="4" fill="#368052"/>
  <text x="1136" y="685" class="sans" font-size="19" font-weight="700" fill="#245C3D">Approved &amp; published</text>
  <text x="1136" y="718" class="sans" font-size="15" fill="#48564D">Every approved source enters Evidence Database.</text>
  <text x="1136" y="743" class="sans" font-size="15" fill="#48564D">Robot models and contribution claims also</text>
  <text x="1136" y="766" class="sans" font-size="15" fill="#48564D">create records in their respective sections.</text>
  <text x="1136" y="819" class="sans" font-size="13" fill="#7B7F74">Inventory updates and corrections remain evidence for manual catalog work.</text>

  <!-- Tracking strip -->
  <rect x="96" y="886" width="1408" height="112" rx="14" fill="#F1F5F2" stroke="#DDE7E0" stroke-width="2"/>
  <circle cx="142" cy="942" r="22" fill="#245C3D"/>
  <path d="M132 942h20M142 932v20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="184" y="930" class="sans" font-size="17" font-weight="700" fill="#183326">Contributor tracking</text>
  <text x="184" y="960" class="sans" font-size="15" fill="#526157">Open Profile to see each submission’s current status, reviewer note, and publication outcome.</text>
  <line x1="832" y1="909" x2="832" y2="975" stroke="#D3DFD6" stroke-width="2"/>
  <text x="872" y="930" class="mono" font-size="12" font-weight="700" letter-spacing="1" fill="#668073">PUBLICATION ROUTING</text>
  <text x="872" y="960" class="sans" font-size="14" fill="#37483E">Robot model → Robot Registry</text>
  <text x="1175" y="960" class="sans" font-size="14" fill="#37483E">Contribution claim → Contributors</text>

  <text x="96" y="1030" class="mono" font-size="11" letter-spacing="1" fill="#8A978E">HUMANOIDTH  •  COMMUNITY DATA PROCESS  •  CURRENT SYSTEM BEHAVIOR</text>
</svg>
